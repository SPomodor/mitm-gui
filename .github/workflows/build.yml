name: Build and test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            unpacked: win-unpacked
          - arch: arm64
            runner: windows-11-arm
            unpacked: win-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CHLS_SMOKE_BUILD_DIR: release
      MITM_GUI_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: npm run setup
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw Error('Tag must match package.json version')"
      - name: Build frontend and check TypeScript
        run: npm run build
      - name: Test backend
        shell: pwsh
        run: |
          npm test -- --junitxml=build/pytest.xml
          $testExit = $LASTEXITCODE
          .venv/Scripts/python.exe scripts/report-test-failures.py build/pytest.xml
          exit $testExit
      - name: Test body formatting and translation catalog
        run: |
          npm run test:format
          npm run test:ui
      - name: Build standalone Python engine
        run: npm run build:engine
      - name: Test compiled engine
        shell: pwsh
        run: |
          $env:CHLS_TEST_ENGINE = (Resolve-Path 'runtime/mitm-gui-engine/mitm-gui-engine.exe').Path
          .venv/Scripts/python.exe -m pytest tests/test_integration.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package desktop app
        run: npx electron-builder --win --${{ matrix.arch }} --dir --publish never
      - name: Verify executable architectures
        run: npm run test:architecture
      - name: Smoke test packaged app
        run: node scripts/ci-check.cjs scripts/smoke-ui.cjs --packaged
      - name: Smoke test language switching
        run: node scripts/ci-check.cjs scripts/smoke-language.cjs
      - name: Build portable EXE
        run: npx electron-builder --win portable --${{ matrix.arch }} --prepackaged release/${{ matrix.unpacked }} --publish never
      - name: Write checksum
        shell: pwsh
        run: |
          Get-ChildItem release/mitm-gui-*-win-${{ matrix.arch }}.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 "release/SHA256SUMS-${{ matrix.arch }}.txt"
          }
      - name: Upload application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mitm-gui-windows-${{ matrix.arch }}
          path: |
            release/mitm-gui-*-win-${{ matrix.arch }}.exe
            release/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-${{ matrix.arch }}-test-diagnostics
          path: |
            build/**/*.png
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MITM_GUI_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install native dependencies
        run: |
          node -e 'if (process.arch !== process.env.MITM_GUI_TARGET_ARCH) throw Error("Runner architecture mismatch")'
          npm run setup
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw Error('Tag must match package.json version')"
      - name: Build frontend and check TypeScript
        env:
          MITM_GUI_CI_TIMEOUT_MS: "180000"
        run: node scripts/ci-check.cjs --command npm run build
      - name: Test backend with bounded diagnostics
        env:
          MITM_GUI_CI_TIMEOUT_MS: "180000"
        run: node scripts/ci-check.cjs scripts/test-backend.cjs -vv -o faulthandler_timeout=60 --junitxml=build/pytest.xml
      - name: Test formatting and UI components
        run: |
          npm run test:format
          npm run test:ui
      - name: Build and test native engine
        run: |
          npm run build:engine
          CHLS_TEST_ENGINE="$PWD/runtime/mitm-gui-engine/mitm-gui-engine" .venv/bin/python -m pytest tests/test_integration.py -q
      - name: Package desktop app
        env:
          # Secrets are absent on forks; unsigned builds remain usable for testing.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MITM_GUI_NOTARIZE: ${{ vars.MITM_GUI_NOTARIZE }}
        run: npx electron-builder --mac --${{ matrix.arch }} --dir --publish never
      - name: Verify architectures and packaged behavior
        run: |
          npm run test:architecture
          node scripts/ci-check.cjs scripts/smoke-ui.cjs --packaged
          node scripts/ci-check.cjs scripts/smoke-language.cjs
          node scripts/ci-check.cjs scripts/smoke-script-editor.cjs --packaged
          node scripts/ci-check.cjs scripts/smoke-macos-lifecycle.cjs
      - name: Build DMG and ZIP
        run: |
          if [ "$MITM_GUI_TARGET_ARCH" = arm64 ]; then unpacked=mac-arm64; else unpacked=mac; fi
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --prepackaged "release/$unpacked/mitm gui.app" --publish never
          cd release
          shasum -a 256 mitm-gui-*-mac-${{ matrix.arch }}.dmg mitm-gui-*-mac-${{ matrix.arch }}.zip > SHA256SUMS-mac-${{ matrix.arch }}.txt
      - name: Upload application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mitm-gui-macos-${{ matrix.arch }}
          path: |
            release/mitm-gui-*-mac-${{ matrix.arch }}.dmg
            release/mitm-gui-*-mac-${{ matrix.arch }}.zip
            release/SHA256SUMS-mac-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-${{ matrix.arch }}-test-diagnostics
          path: |
            build/**/*.png
            build/**/*.log
            build/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: mitm-gui-*
          merge-multiple: true
          path: artifacts
      - name: Verify complete release asset set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for arch in x64 arm64; do
            test -s "artifacts/mitm-gui-$version-win-$arch.exe"
            test -s "artifacts/SHA256SUMS-$arch.txt"
            test -s "artifacts/mitm-gui-$version-mac-$arch.dmg"
            test -s "artifacts/mitm-gui-$version-mac-$arch.zip"
            test -s "artifacts/SHA256SUMS-mac-$arch.txt"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            cat > release-notes.md <<'NOTES'
          ## macOS builds

          Separate arm64 (Apple Silicon) and x64 (Intel) DMG/ZIP builds include a native engine. Each macOS runner executes source, frozen-engine and packaged desktop tests. Without Developer ID credentials macOS builds have only an ad-hoc integrity signature and are not notarized. See [macOS installation and Gatekeeper instructions](https://github.com/SPomodor/mitm-gui/blob/main/docs/macos.md) ([Русский](https://github.com/SPomodor/mitm-gui/blob/main/docs/macos.ru.md)). System proxy and CA trust setup remain explicit user actions. Verify the architecture-specific SHA256SUMS file.

          ## Windows builds

          - **x64**: x64 interface and network engine.
          - **ARM64 hybrid**: native ARM64 interface with the x64 network engine under Windows 11 emulation. This is not a fully native ARM64 build. Windows 11 on ARM64 is required.

          Both builds pass proxy, WireGuard, scripting and desktop tests on their respective Windows runners before publication. Check the matching SHA256SUMS file after downloading.

          Windows x86/32-bit, ARM32 and Windows 10 ARM are not supported by this release.
          NOTES
            gh release create "$TAG" --draft --verify-tag --title "mitm gui $TAG" --notes-file release-notes.md --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --clobber
          gh release edit "$TAG" --draft=false --latest
